server:
  host: "0.0.0.0"
  port: 8787

auth:
  username: "admin"
  # 默认密码 admin123 —— 上线前务必修改
  password_hash: "$2b$12$gTzuV/qodW.QINkFIt9XlOorOGLvjsKGbbaHf.LBdHrYMCoe1sg1K"
  jwt_secret: "change-me-to-long-random-string"
  jwt_expire_sec: 86400

collect:
  # 主机、Docker、风扇的采样周期。仪表盘快刷新见 display.refresh.overview_sec（默认同样是 1 秒）。
  interval_sec: 1
  # 文件系统 / 存储池容量的读盘周期。界面更换这份缓存见 display.refresh.disk_sec。
  fs_interval_sec: 60
  retention_days: 7
  # true：无 Docker/SMART 时用模拟数据，便于开发机跑通
  mock_on_failure: true
  filesystem_mounts: []
  filesystem_exclude_prefixes:
    - "/proc"
    - "/sys"
    - "/run"
    - "/var/lib/docker"
    - "/snap"
  # 磁盘吞吐条满格（字节/秒）。0 表示按近期采样峰值归一。
  disk_bps_cap: 0
  # 硬盘插拔去抖（秒）。盘符集合变化后，连续稳定这么久才重新跑 SMART。
  # 去抖窗口内不调用 smartctl。0 表示立刻接受插拔。网页「高级」可覆盖，写入 SQLite。
  disk_plug_debounce_sec: 8

smart:
  enabled: true
  # SMART / smartctl 周期。比总览慢，避免频繁读盘。网页「高级」可覆盖。
  interval_sec: 900
  devices: []
  skip_standby: true
  temp_warn_c: 55

docker:
  enabled: true
  watch_containers: []

power:
  # 电源额定功率（瓦）。资源卡功耗条 = 当前瓦数 / 该值。
  # 设为 0 则只显示瓦数，不画百分比。IPMI 读到的是整机功率；RAPL 只是封装+内存估算。
  rated_watts: 200

fans:
  # 真调速默认开启。仅当对应 hwmon pwm 可写且写后读回一致时才会生效。
  control_enabled: true
  # 手动 PWM 下限（0–100）。更低的请求会被拒绝，避免停转。
  min_pwm_percent: 25
  presets:
    silent: 30
    normal: 55
    performance: 85

alerts:
  enabled: true
  cooldown_default_sec: 3600
  apprise_urls: []
  # - "tgram://BOT_TOKEN/CHAT_ID"
  # - "mailto://user:pass@smtp.example.com:587?to=you@example.com"
  # - "json://example.com/webhook"
  rules:
    fs_used_warn_pct: 85
    fs_used_crit_pct: 95
    cpu_high_pct: 90
    cpu_high_duration_sec: 600
    mem_used_warn_pct: 90
    temp_cpu_warn_c: 85

display:
  timezone: "Asia/Shanghai"
  # 容量显示的默认值。网页「展示校准」保存后写入 SQLite，优先于这里。
  # unit: gib（1024，GiB/TiB）/ gb（1000，GB/TB）/ label（厂商标称，没有则 GiB）
  capacity:
    unit: gib
    decimals: 1
  # 界面分级刷新。总览快，磁盘和 SMART 慢，只是更换已经采到的缓存，不额外读盘。
  # 真正读盘的是 collect.fs_interval_sec 和 smart.interval_sec。
  # 网页「高级」保存后写入 SQLite，优先于这里。
  refresh:
    overview_sec: 1
    disk_sec: 60
    smart_sec: 60
